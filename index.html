<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Party Porch — Launch Tracker</title>
<style>
  :root{
    --bg:#0f0b1e; --card:#1b1533; --card2:#241b42; --accent:#a855f7; --accent2:#f59e0b;
    --text:#f3effe; --muted:#a89ecb; --good:#22c55e; --line:#332a52; --pink:#ec4899;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#160f2e,#0f0b1e 40%);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:90px;line-height:1.5;font-size:16px;
  }
  header{
    position:sticky;top:0;z-index:50;padding:14px 16px calc(10px + env(safe-area-inset-top));
    padding-top:calc(14px + env(safe-area-inset-top));
    background:linear-gradient(135deg,#7c3aed,#db2777);box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  header h1{margin:0;font-size:20px;letter-spacing:.3px}
  header .sub{font-size:12px;opacity:.9;margin-top:2px}
  .progwrap{margin-top:10px;background:rgba(0,0,0,.25);border-radius:20px;height:22px;overflow:hidden;position:relative}
  .progbar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#a3e635);transition:width .4s ease}
  .progtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  nav{display:flex;overflow-x:auto;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--bg);
    scrollbar-width:none;border-bottom:1px solid var(--line)}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);
    padding:8px 14px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{padding:16px}
  .tab{display:none;animation:fade .25s ease}
  .tab.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  h2.section{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin:22px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:16px}
  .task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .task input{appearance:none;min-width:18px;width:18px;height:18px;margin-top:2px;border:2px solid var(--accent);
    border-radius:5px;position:relative;cursor:pointer;background:transparent;transition:.15s}
  .task input:checked{background:var(--good);border-color:var(--good)}
  .task input:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#062b12;font-weight:900;font-size:12px}
  .task label{flex:1;cursor:pointer;font-size:15px}
  .task input:checked + label{text-decoration:line-through;color:var(--muted)}
  .owner{flex:none;margin-left:8px;align-self:center;font-size:12px;font-weight:700;color:var(--muted);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:4px 6px;cursor:pointer;max-width:96px}
  .owner.set{color:var(--accent);border-color:var(--accent);background:rgba(56,189,248,.08)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;margin-left:6px;vertical-align:middle}
  .p-spend{background:#7c2d12;color:#fed7aa}
  .p-content{background:#5b21b6;color:#ddd6fe}
  .p-mkt{background:#155e75;color:#a5f3fc}
  .p-goal{background:#065f46;color:#a7f3d0}
  .phase{font-size:12px;color:var(--muted);margin:2px 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--accent2);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .big{font-size:26px;font-weight:800;color:#fff}
  .muted{color:var(--muted)}
  .kpi{display:flex;gap:10px;flex-wrap:wrap}
  .kpi .box{flex:1;min-width:90px;background:var(--card2);border-radius:12px;padding:12px;text-align:center}
  .kpi .box .n{font-size:22px;font-weight:800}
  .kpi .box .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  ul.clean{padding-left:18px;margin:6px 0}
  ul.clean li{margin:5px 0}
  .warn{background:#3b1d1d;border:1px solid #7f1d1d;border-radius:12px;padding:10px 12px;font-size:13px;color:#fecaca;margin:10px 0}
  .tip{background:#12261b;border:1px solid #14532d;border-radius:12px;padding:10px 12px;font-size:13px;color:#bbf7d0;margin:10px 0}
  .quote{background:var(--card2);border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:13px;margin:8px 0;white-space:pre-wrap}
  .reset{display:block;width:100%;margin-top:20px;background:transparent;color:var(--muted);border:1px solid var(--line);padding:12px;border-radius:12px;font-size:13px}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:12px;border-radius:10px;font-size:16px;font-family:inherit}
  select{appearance:none}
  .row2{display:flex;gap:10px}.row2 .field{flex:1}
  .btn{width:100%;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border:none;
    padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
  .lead{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .lead .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lead .nm{font-weight:700;font-size:16px}
  .lead .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .st{font-size:11px;font-weight:800;padding:4px 10px;border-radius:12px;border:none;cursor:pointer;color:#fff}
  .st-Lead{background:#475569}.st-Quoted{background:#b45309}.st-Booked{background:#15803d}
  .st-Done{background:#6d28d9}.st-Lost{background:#7f1d1d}
  .del{background:none;border:none;color:#7f5a7a;font-size:18px;cursor:pointer;padding:4px 8px}
  a{color:var(--accent2)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}
  details summary{cursor:pointer;font-weight:600;padding:6px 0}
  /* ---- Gantt ---- */
  .gantt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:6px 0 14px}
  .gantt{display:grid;grid-template-columns:132px repeat(21,minmax(30px,1fr));gap:5px 4px;min-width:820px;padding:14px 12px;align-items:center}
  .g-lbl{grid-column:1;font-size:12px;font-weight:600;white-space:nowrap;color:var(--text)}
  .g-sec{grid-column:1 / -1;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent2);font-weight:800;margin-top:8px}
  .g-year{text-align:center;font-size:11px;font-weight:800;color:var(--muted);background:var(--card2);border-radius:6px;padding:3px 0}
  .g-mon{text-align:center;font-size:10px;color:var(--muted)}
  .g-mon.q{color:var(--accent);font-weight:800}
  .gbar{height:24px;border-radius:8px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .gp0{background:linear-gradient(90deg,#7c3aed,#a855f7)}
  .gp1{background:linear-gradient(90deg,#2563eb,#38bdf8)}
  .gp2{background:linear-gradient(90deg,#0891b2,#22d3ee);color:#062430}
  .gp3{background:linear-gradient(90deg,#059669,#34d399);color:#052e1c}
  .gp4{background:linear-gradient(90deg,#d97706,#fbbf24);color:#3b1d00}
  .gprod{height:22px;background:rgba(168,85,247,.18);border:1px solid #a855f7;color:#e9d5ff}
  .gteam{height:22px;background:rgba(236,72,153,.18);border:1px solid var(--pink);color:#fbcfe8}
  .grev{height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .grev1{background:#14532d;color:#bbf7d0}.grev2{background:#166534;color:#dcfce7}
  .grev3{background:#15803d;color:#fff}.grev4{background:#22c55e;color:#052e1c}
  .grev5{background:linear-gradient(90deg,#a3e635,#facc15);color:#1a2e05}
  .g-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:2px 0 10px}
  .g-legend span{display:inline-flex;align-items:center;gap:5px}
  .g-legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
</style>
</head>

/* ---------------- RENDER ---------------- */
const tagMap={spend:['💰','p-spend'],content:['📹','p-content'],mkt:['📣','p-mkt'],goal:['🎯','p-goal']};
let allIds=[];
TRACKER.forEach(p=>p.items.forEach(i=>allIds.push(i.id)));

function loadState(){try{return JSON.parse(localStorage.getItem('ppTracker')||'{}')}catch(e){return {}}}
function saveState(s){localStorage.setItem('ppTracker',JSON.stringify(s))}
let state=loadState();
function loadOwners(){try{return JSON.parse(localStorage.getItem('ppOwners')||'{}')}catch(e){return {}}}
function saveOwners(o){localStorage.setItem('ppOwners',JSON.stringify(o))}
let owners=loadOwners();
const OWNER_NAMES=['Ryan','Thilye'];
// seed pre-done
TRACKER.forEach(p=>p.items.forEach(i=>{if(i.done&&!(i.id in state))state[i.id]=true}));

function ownerSelect(id){
  const cur=owners[id]||'';
  let opts=`<option value=""${cur===''?' selected':''}>— who?</option>`;
  OWNER_NAMES.forEach(n=>{opts+=`<option value="${n}"${cur===n?' selected':''}>${n}</option>`});
  return `<select class="owner${cur?' set':''}" onchange="setOwner('${id}',this.value)">${opts}</select>`;
}
function setOwner(id,val){if(val){owners[id]=val}else{delete owners[id]}saveOwners(owners);render();}

function renderTracker(){
  let h='<h2 class="section">Master Tracker</h2>';
  TRACKER.forEach(p=>{
    h+=`<div class="card"><div class="phase">${p.phase}</div>`;
    p.items.forEach(i=>{
      const checked=state[i.id]?'checked':'';
      let tags='';(i.tags||[]).forEach(t=>{const[e,c]=tagMap[t];tags+=`<span class="pill ${c}">${e}</span>`});
      h+=`<div class="task"><input type="checkbox" id="${i.id}" ${checked} onchange="toggle('${i.id}')"><label for="${i.id}">${i.t}${tags}</label>${ownerSelect(i.id)}</div>`;
    });
    h+='</div>';
  });
  h+='<button class="reset" onclick="resetAll()">↺ Reset all progress</button>';
  h+='<div class="foot">The Party Porch · saved on this device</div>';
  return h;
}
function toggle(id){state[id]=!state[id];saveState(state);updateProgress()}
function resetAll(){if(confirm('Reset all checkboxes?')){state={};TRACKER.forEach(p=>p.items.forEach(i=>{if(i.done)state[i.id]=true}));saveState(state);render();}}
function updateProgress(){
  const done=allIds.filter(id=>state[id]).length;
  const pct=Math.round(done/allIds.length*100);
  document.getElementById('progbar').style.width=pct+'%';
  document.getElementById('progtxt').textContent=`${done}/${allIds.length} done · ${pct}%`;
}

/* ---------------- LEADS LOG ---------------- */
const STATUSES=["Lead","Quoted","Booked","Done","Lost"];
function loadLeads(){try{return JSON.parse(localStorage.getItem('ppLeads')||'[]')}catch(e){return []}}
function saveLeads(l){localStorage.setItem('ppLeads',JSON.stringify(l))}
let leads=loadLeads();
function addLead(){
  const g=id=>document.getElementById(id).value.trim();
  const name=g('l_name');
  if(!name){alert('Add a name/contact');return;}
  leads.unshift({id:'L'+Date.now(),name,date:g('l_date'),kids:g('l_kids'),
    source:g('l_source'),value:g('l_value'),status:'Lead'});
  saveLeads(leads);render();
}
function cycleStatus(id){
  const l=leads.find(x=>x.id===id);if(!l)return;
  l.status=STATUSES[(STATUSES.indexOf(l.status)+1)%STATUSES.length];
  saveLeads(leads);render();
}
function delLead(id){if(confirm('Delete this lead?')){leads=leads.filter(x=>x.id!==id);saveLeads(leads);render();}}
function renderLeads(){
  const booked=leads.filter(l=>l.status==='Booked'||l.status==='Done');
  const pipeVal=leads.filter(l=>l.status!=='Lost'&&l.status!=='Done')
    .reduce((s,l)=>s+(parseFloat(l.value)||0),0);
  const wonVal=leads.filter(l=>l.status==='Done').reduce((s,l)=>s+(parseFloat(l.value)||0),0);
  let h='<h2 class="section">Leads &amp; Bookings</h2>';
  h+=`<div class="kpi">
    <div class="box"><div class="n">${leads.length}</div><div class="l">leads</div></div>
    <div class="box"><div class="n">${booked.length}</div><div class="l">booked</div></div>
    <div class="box"><div class="n">$${pipeVal}</div><div class="l">pipeline</div></div>
    <div class="box"><div class="n">$${wonVal}</div><div class="l">earned</div></div></div>`;
  h+=`<div class="card"><h3>➕ Add a lead</h3>
    <div class="field"><label>Name / contact</label><input id="l_name" placeholder="e.g. Sarah (Insta DM)"></div>
    <div class="row2">
      <div class="field"><label>Party date</label><input id="l_date" placeholder="Sep 20"></div>
      <div class="field"><label># kids</label><input id="l_kids" inputmode="numeric" placeholder="12"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Source</label><select id="l_source">
        <option>Instagram</option><option>TikTok</option><option>Facebook group</option>
        <option>Nextdoor</option><option>Marketplace</option><option>Referral</option>
        <option>Google</option><option>Repeat</option><option>Other</option></select></div>
      <div class="field"><label>Est. $ value</label><input id="l_value" inputmode="numeric" placeholder="349"></div>
    </div>
    <button class="btn" onclick="addLead()">Add lead</button></div>`;
  if(leads.length===0){
    h+='<div class="card muted">No leads yet. Every inquiry goes here — tap a status chip to move Lead → Quoted → Booked → Done. Track which source books best.</div>';
  }else{
    leads.forEach(l=>{
      h+=`<div class="lead"><div class="top">
        <div><div class="nm">${l.name}</div>
        <div class="meta">${[l.date&&('📅 '+l.date),l.kids&&('👦 '+l.kids),l.source&&('📣 '+l.source),l.value&&('💵 $'+l.value)].filter(Boolean).join(' · ')||'—'}</div></div>
        <button class="st st-${l.status}" onclick="cycleStatus('${l.id}')">${l.status}</button>
      </div>
      <div style="text-align:right;margin-top:2px"><button class="del" onclick="delLead('${l.id}')">🗑️</button></div></div>`;
    });
  }
  h+='<div class="foot">Tip: tap the status chip to advance it. Saved on this device.</div>';
  return h;
}

/* ---------- Expenses ---------- */
const EXP_CATS=["Startup","Gear/Kit","Marketing","Software","Insurance","Legal","Fuel","Other"];
function loadExpenses(){
  const raw=localStorage.getItem('ppExpenses');
  if(raw===null){ // first load — seed with the domain purchase
    const seed=[{id:'E'+Date.now(),item:'Domain (yourpartyporch.com)',amount:45,cat:'Startup',date:'Jul 6, 2026'}];
    localStorage.setItem('ppExpenses',JSON.stringify(seed));
    return seed;
  }
  try{return JSON.parse(raw)}catch(e){return []}
}
function saveExpenses(x){localStorage.setItem('ppExpenses',JSON.stringify(x))}
let expenses=loadExpenses();
function addExpense(){
  const g=id=>document.getElementById(id).value.trim();
  const item=g('x_item'); const amount=parseFloat(g('x_amount'));
  if(!item){alert('Add what you spent on');return;}
  if(isNaN(amount)){alert('Add an amount');return;}
  expenses.unshift({id:'E'+Date.now(),item,amount,cat:g('x_cat'),date:g('x_date')||'—'});
  saveExpenses(expenses);render();
}
function delExpense(id){if(confirm('Delete this expense?')){expenses=expenses.filter(x=>x.id!==id);saveExpenses(expenses);render();}}
function renderExpenses(){
  const total=expenses.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
  const budgetLeft=600-total;
  const byCat={};
  expenses.forEach(x=>{byCat[x.cat]=(byCat[x.cat]||0)+(parseFloat(x.amount)||0)});
  let h='<h2 class="section">Expenses</h2>';
  h+=`<div class="kpi">
    <div class="box"><div class="n">$${total.toFixed(0)}</div><div class="l">spent</div></div>
    <div class="box"><div class="n">${expenses.length}</div><div class="l">items</div></div>
    <div class="box"><div class="n">$${budgetLeft.toFixed(0)}</div><div class="l">of $600 left</div></div></div>`;
  h+=`<div class="card"><h3>➕ Add an expense</h3>
    <div class="field"><label>What for</label><input id="x_item" placeholder="e.g. Blasters, darts, insurance"></div>
    <div class="row2">
      <div class="field"><label>Amount ($)</label><input id="x_amount" inputmode="decimal" placeholder="45"></div>
      <div class="field"><label>Date</label><input id="x_date" placeholder="Jul 6"></div>
    </div>
    <div class="field"><label>Category</label><select id="x_cat">${EXP_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <button class="btn" onclick="addExpense()">Add expense</button></div>`;
  if(Object.keys(byCat).length){
    h+='<div class="card"><h3>📊 By category</h3>';
    Object.keys(byCat).forEach(c=>{h+=`<div class="lead" style="padding:8px 12px"><div class="top"><div class="nm">${c}</div><div class="nm">$${byCat[c].toFixed(0)}</div></div></div>`});
    h+='</div>';
  }
  if(expenses.length===0){
    h+='<div class="card muted">No expenses yet. Log every dollar (gear, ads, insurance, fuel) here to keep clean books and know your real profit.</div>';
  }else{
    expenses.forEach(x=>{
      h+=`<div class="lead"><div class="top">
        <div><div class="nm">${x.item}</div>
        <div class="meta">${[x.date&&('📅 '+x.date),x.cat&&('🏷️ '+x.cat)].filter(Boolean).join(' · ')||'—'}</div></div>
        <div class="nm">$${(parseFloat(x.amount)||0).toFixed(2)}</div>
      </div>
      <div style="text-align:right;margin-top:2px"><button class="del" onclick="delExpense('${x.id}')">🗑️</button></div></div>`;
    });
  }
  h+='<div class="foot">Keep this account separate for clean books. Saved on this device.</div>';
  return h;
}
let active='Tracker';
function render(){
  const nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(t=>`<button class="${t===active?'active':''}" onclick="go('${t}')">${t}</button>`).join('');
  const main=document.getElementById('main');
  main.innerHTML=`<div class="tab active">${active==='Tracker'?renderTracker():active==='Leads'?renderLeads():active==='Expenses'?renderExpenses():CONTENT[active]}</div>`;
  updateProgress();
  window.scrollTo(0,0);
}
function go(t){active=t;render()}
render();
